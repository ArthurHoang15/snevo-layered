name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "refracttor/**"

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Check environment safety
        run: npm run check:env

      - name: Check layered architecture rules
        run: npm run check:architecture

      - name: Run tests
        run: npm test

  cd-preview:
    name: CD preview package
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment bundle preview
        run: |
          git archive --format=zip --output=snevo-preview.zip HEAD
          if unzip -Z1 snevo-preview.zip | grep -E '(^|/)(local\.env|\.env)$|(^|/)node_modules/'; then
            echo "::error::Deployment bundle contains local environment or dependency files"
            exit 1
          fi

      - name: Confirm deployment readiness
        run: echo "Deployment bundle preview is clean. AWS CD deploys on main or manual workflow dispatch."
