server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index pages/index.html;

  location = / {
    try_files /pages/index.html =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location /pages/ {
    try_files $uri =404;
  }

  location / {
    try_files /pages$uri.html /pages$uri /pages/index.html;
  }
}
