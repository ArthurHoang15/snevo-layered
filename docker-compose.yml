services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - local.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DB_SCHEMA: db_nike
      APP_NAME: snevo-api
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
